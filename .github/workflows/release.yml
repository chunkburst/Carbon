name: Carbon release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.5"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.18.3"

jobs:
  preflight:
    name: Verify release input and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify the immutable release input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tag_commit" != "$event_commit" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not resolve to the workflow commit." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tags must point exactly at the current origin/main commit." >&2
            echo "tag:  $tag_commit" >&2
            echo "main: $main_commit" >&2
            exit 1
          fi
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal web/embed.go)"
      - name: Run go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Lint web
        run: pnpm lint
        working-directory: web
      - name: Build web
        run: pnpm build
        working-directory: web

  windows:
    name: Build Carbon Windows x64
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Verify committed release version and source tree
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build portable, CLI, NSIS, and MSI artifacts
        shell: pwsh
        working-directory: desktop
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable on the Windows runner."
          }
          $installationPath = [string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with the MSVC x64 toolchain is unavailable."
          }
          $vcvarsall = Join-Path $installationPath.Trim() "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
            throw "vcvarsall.bat is unavailable: $vcvarsall"
          }
          $buildCommand = "call `"$vcvarsall`" x64 && pnpm.cmd release:windows"
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed with exit code $LASTEXITCODE."
          }
      - name: Verify Windows release assets after the build
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "desktop\src-tauri\target\release-assets\Carbon-$version-windows-x64"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE "scripts\verify-windows-release.ps1") -AssetDirectory $assetDir -Version $version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $resolvedAssetDir = (Resolve-Path -LiteralPath $assetDir -ErrorAction Stop).ProviderPath
          "asset_dir=$resolvedAssetDir" >> $env:GITHUB_OUTPUT
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Carbon-${{ github.ref_name }}-windows-x64
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Carbon-${{ github.ref_name }}-windows-x64
          path: release-assets
      - name: Verify downloaded file set and SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset_dir="$GITHUB_WORKSPACE/release-assets"
          expected_assets=(
            "Carbon_${version}_x64-setup.exe"
            "Carbon_${version}_x64_en-US.msi"
            "Carbon-${version}-windows-portable.zip"
            "carbon-${version}-windows-x64-cli.zip"
            "SHA256SUMS.txt"
          )
          mapfile -t actual_assets < <(find "$asset_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#actual_assets[@]}" -ne "${#expected_assets[@]}" ]]; then
            echo "Downloaded artifact must contain exactly five top-level files." >&2
            printf 'Found: %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
          for index in "${!expected_sorted[@]}"; do
            if [[ "${actual_assets[$index]}" != "${expected_sorted[$index]}" || ! -f "$asset_dir/${actual_assets[$index]}" || ! -s "$asset_dir/${actual_assets[$index]}" ]]; then
              echo "Downloaded artifact contains an unexpected, non-file, or empty asset: ${actual_assets[$index]}" >&2
              exit 1
            fi
          done
          cd "$asset_dir"
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish only if the tag still targets this workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset_dir="$GITHUB_WORKSPACE/release-assets"
          version="${tag#v}"

          resolve_remote_tag_commit() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            while [[ "$object_type" == "tag" ]]; do
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Tag $tag does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          tag_commit="$(resolve_remote_tag_commit)"
          if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish: $tag now targets $tag_commit, not this workflow commit $EXPECTED_SHA." >&2
            exit 1
          fi
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_commit" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish: origin/main now targets $main_commit, not this workflow commit $EXPECTED_SHA." >&2
            exit 1
          fi

          assets=(
            "$asset_dir/Carbon_${version}_x64-setup.exe"
            "$asset_dir/Carbon_${version}_x64_en-US.msi"
            "$asset_dir/Carbon-${version}-windows-portable.zip"
            "$asset_dir/carbon-${version}-windows-x64-cli.zip"
            "$asset_dir/SHA256SUMS.txt"
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --repo "$GITHUB_REPOSITORY" --title "Carbon $tag" --notes "Windows x64 release: recommended NSIS installer, MSI, portable ZIP, CLI-only ZIP, and SHA-256 checksums."
          fi
