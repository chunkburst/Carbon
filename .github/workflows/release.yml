name: Carbon release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.5"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.18.3"

jobs:
  preflight:
    name: Verify release input and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify the immutable release input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tag_commit" != "$event_commit" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not resolve to the workflow commit." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tags must point exactly at the current origin/main commit." >&2
            echo "tag:  $tag_commit" >&2
            echo "main: $main_commit" >&2
            exit 1
          fi
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal web/embed.go)"
      - name: Run go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Lint web
        run: pnpm lint
        working-directory: web
      - name: Build web
        run: pnpm build
        working-directory: web

  windows:
    name: Build Carbon Windows x64
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Verify committed release version and source tree
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build portable, CLI, NSIS, and MSI artifacts
        shell: pwsh
        working-directory: desktop
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable on the Windows runner."
          }
          $installationPath = [string](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with the MSVC x64 toolchain is unavailable."
          }
          $vcvarsall = Join-Path $installationPath.Trim() "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
            throw "vcvarsall.bat is unavailable: $vcvarsall"
          }
          $buildCommand = "call `"$vcvarsall`" x64 && pnpm.cmd release:windows"
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed with exit code $LASTEXITCODE."
          }
      - name: Verify Windows release assets after the build
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "desktop\src-tauri\target\release-assets\Carbon-$version-windows-x64"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE "scripts\verify-windows-release.ps1") -AssetDirectory $assetDir -Version $version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $resolvedAssetDir = (Resolve-Path -LiteralPath $assetDir -ErrorAction Stop).ProviderPath
          "asset_dir=$resolvedAssetDir" >> $env:GITHUB_OUTPUT
      - name: Upload verified Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Carbon-${{ github.ref_name }}-windows-x64
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos:
    name: Build Carbon macOS ${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: macos-${{ matrix.target }}
      - name: Verify committed release version and source tree
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build and verify unsigned macOS artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-macos-release.sh "${{ matrix.target }}" "${{ matrix.arch }}"
      - name: Resolve macOS release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset_dir="$GITHUB_WORKSPACE/desktop/src-tauri/target/release-assets/Carbon-$version-macos-${{ matrix.arch }}"
          [[ -d "$asset_dir" ]]
          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Carbon-${{ github.ref_name }}-macos-${{ matrix.arch }}
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  linux:
    name: Build Carbon Linux ${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: linux-${{ matrix.target }}
      - name: Install Linux desktop packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xdg-utils
      - name: Verify committed release version and source tree
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build and verify Linux artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-linux-release.sh "${{ matrix.target }}" "${{ matrix.arch }}"
      - name: Resolve Linux release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset_dir="$GITHUB_WORKSPACE/desktop/src-tauri/target/release-assets/Carbon-$version-linux-${{ matrix.arch }}"
          [[ -d "$asset_dir" ]]
          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"
      - name: Upload verified Linux assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Carbon-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download every verified platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Carbon-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify the complete file set and create global checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset_dir="$GITHUB_WORKSPACE/release-assets"
          package_assets=(
            "Carbon_${version}_x64-setup.exe"
            "Carbon_${version}_x64_en-US.msi"
            "Carbon-${version}-windows-portable.zip"
            "carbon-${version}-windows-x64-cli.zip"
            "Carbon-${version}-macos-arm64.dmg"
            "carbon-${version}-macos-arm64-cli.tar.gz"
            "Carbon-${version}-macos-x64.dmg"
            "carbon-${version}-macos-x64-cli.tar.gz"
            "Carbon-${version}-linux-arm64.AppImage"
            "Carbon-${version}-linux-arm64.deb"
            "carbon-${version}-linux-arm64-cli.tar.gz"
            "Carbon-${version}-linux-x64.AppImage"
            "Carbon-${version}-linux-x64.deb"
            "carbon-${version}-linux-x64-cli.tar.gz"
          )
          expected_assets=("${package_assets[@]}" "SHA256SUMS.txt")

          if find "$asset_dir" -mindepth 1 -type l -print -quit | grep -q .; then
            echo "Release artifacts must not contain symbolic links." >&2
            exit 1
          fi
          mapfile -t actual_assets < <(find "$asset_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
          if [[ "${#actual_assets[@]}" -ne "${#expected_sorted[@]}" ]]; then
            echo "Expected exactly ${#expected_sorted[@]} downloaded files; found ${#actual_assets[@]}." >&2
            printf 'Found: %s\n' "${actual_assets[*]}" >&2
            exit 1
          fi
          for index in "${!expected_sorted[@]}"; do
            name="${actual_assets[$index]}"
            if [[ "$name" != "${expected_sorted[$index]}" || ! -f "$asset_dir/$name" || ! -s "$asset_dir/$name" ]]; then
              echo "Unexpected, non-file, or empty release input: $name" >&2
              exit 1
            fi
          done
          tr -d '\r' < "$asset_dir/SHA256SUMS.txt" > "$asset_dir/SHA256SUMS.txt.lf"
          mv "$asset_dir/SHA256SUMS.txt.lf" "$asset_dir/SHA256SUMS.txt"
          mapfile -t windows_checksum_names < <(awk '{print $2}' "$asset_dir/SHA256SUMS.txt" | sed 's/^\*//' | LC_ALL=C sort)
          windows_expected=(
            "Carbon_${version}_x64-setup.exe"
            "Carbon_${version}_x64_en-US.msi"
            "Carbon-${version}-windows-portable.zip"
            "carbon-${version}-windows-x64-cli.zip"
          )
          mapfile -t windows_expected_sorted < <(printf '%s\n' "${windows_expected[@]}" | LC_ALL=C sort)
          if [[ "${#windows_checksum_names[@]}" -ne 4 ]]; then
            echo "The Windows checksum manifest must contain exactly four entries." >&2
            exit 1
          fi
          for index in "${!windows_expected_sorted[@]}"; do
            if [[ "${windows_checksum_names[$index]}" != "${windows_expected_sorted[$index]}" ]]; then
              echo "The Windows checksum manifest contains an unexpected file." >&2
              exit 1
            fi
          done
          (cd "$asset_dir" && sha256sum --check --strict SHA256SUMS.txt)

          mapfile -t packages_sorted < <(printf '%s\n' "${package_assets[@]}" | LC_ALL=C sort)
          (
            cd "$asset_dir"
            : > SHA256SUMS.txt.new
            for name in "${packages_sorted[@]}"; do
              sha256sum "$name" >> SHA256SUMS.txt.new
            done
            mv SHA256SUMS.txt.new SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Publish only if the tag still targets this workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          asset_dir="$GITHUB_WORKSPACE/release-assets"

          resolve_remote_tag_commit() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            while [[ "$object_type" == "tag" ]]; do
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Tag $tag does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$object_sha"
          }

          tag_commit="$(resolve_remote_tag_commit)"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tag_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to publish because the tag or main branch moved during the build." >&2
            echo "workflow=$EXPECTED_SHA tag=$tag_commit main=$main_commit" >&2
            exit 1
          fi

          mapfile -t expected_names < <(find "$asset_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#expected_names[@]}" -ne 15 ]]; then
            echo "Refusing to publish an incomplete release asset set." >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/carbon-release-notes.md"
          cat > "$notes_file" <<EOF
          Carbon $tag includes native desktop and CLI builds for:

          - Windows 10/11 x64: NSIS installer, MSI, portable ZIP, and CLI ZIP
          - macOS 12+ Apple Silicon and Intel: DMG and CLI tar.gz
          - Linux x64 and ARM64: AppImage, DEB, and CLI tar.gz

          The macOS builds are currently unsigned and not notarized. Gatekeeper may require an explicit user approval before first launch. Windows builds are also unsigned. Verify every download with SHA256SUMS.txt.
          EOF

          tag_commit="$(resolve_remote_tag_commit)"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tag_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to upload because the tag or main branch moved after asset verification." >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mapfile -t remote_assets < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for remote_name in "${remote_assets[@]}"; do
              if ! printf '%s\n' "${expected_names[@]}" | grep -Fqx -- "$remote_name"; then
                gh release delete-asset "$tag" "$remote_name" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done
            gh release upload "$tag" "$asset_dir"/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Carbon $tag" --notes-file "$notes_file"
          else
            gh release create "$tag" "$asset_dir"/* --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Carbon $tag" --notes-file "$notes_file"
          fi

          mapfile -t published_names < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [[ "${#published_names[@]}" -ne "${#expected_names[@]}" ]]; then
            echo "Published release has an unexpected asset count." >&2
            exit 1
          fi
          for index in "${!expected_names[@]}"; do
            if [[ "${published_names[$index]}" != "${expected_names[$index]}" ]]; then
              echo "Published release asset set is not exact." >&2
              exit 1
            fi
          done

          tag_commit="$(resolve_remote_tag_commit)"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tag_commit" != "$EXPECTED_SHA" || "$main_commit" != "$EXPECTED_SHA" ]]; then
            echo "Published assets are valid, but the tag or main branch moved during upload." >&2
            exit 1
          fi

          remote_asset_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          mapfile -t remote_digests < <(jq -r '.assets[] | [.name, .digest] | @tsv' <<<"$remote_asset_json")
          if [[ "${#remote_digests[@]}" -ne 15 ]]; then
            echo "GitHub did not return a digest for the exact release asset set." >&2
            exit 1
          fi
          for remote_entry in "${remote_digests[@]}"; do
            IFS=$'\t' read -r remote_name remote_digest <<<"$remote_entry"
            local_digest="sha256:$(sha256sum "$asset_dir/$remote_name" | awk '{print $1}')"
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "GitHub digest mismatch for $remote_name: $remote_digest != $local_digest" >&2
              exit 1
            fi
          done
