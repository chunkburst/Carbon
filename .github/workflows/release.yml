name: Carbon release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.5"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  windows:
    name: Carbon Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Set version from tag
        run: node scripts/set-desktop-version.mjs "${{ github.ref_name }}"
      - name: Build portable, CLI, NSIS and MSI artifacts
        run: pnpm release:windows
        working-directory: desktop
      - name: Verify Windows release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $assetDir = "desktop/src-tauri/target/release-assets/Carbon-$version-windows-x64"
          if (-not (Test-Path -LiteralPath $assetDir -PathType Container)) {
            throw "Release asset directory is missing: $assetDir"
          }
          $required = @(
            "Carbon_${version}_x64-setup.exe",
            "Carbon_${version}_x64_en-US.msi",
            "Carbon-${version}-windows-portable.zip",
            "carbon-${version}-windows-x64-cli.zip",
            "SHA256SUMS.txt"
          )
          foreach ($name in $required) {
            $path = Join-Path $assetDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Release asset is missing or empty: $path"
            }
          }
          $unexpected = @(Get-ChildItem -LiteralPath $assetDir -File | Where-Object Name -notin $required)
          if ($unexpected.Count -ne 0) {
            throw "Unexpected release assets: $($unexpected.Name -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $portable = Join-Path $assetDir "Carbon-${version}-windows-portable.zip"
          $zip = [IO.Compression.ZipFile]::OpenRead($portable)
          try {
            $names = @($zip.Entries | ForEach-Object Name)
            foreach ($name in @("Carbon Portable.exe", "carbon.exe", "WebView2Loader.dll", "carbon-portable.marker", "README.txt")) {
              if ($names -notcontains $name) { throw "Portable ZIP is missing $name." }
            }
          } finally {
            $zip.Dispose()
          }
          Push-Location $assetDir
          try {
            foreach ($line in Get-Content -LiteralPath "SHA256SUMS.txt") {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
              $actual = (Get-FileHash -LiteralPath $Matches[2] -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
            }
          } finally {
            Pop-Location
          }
          "asset_dir=$((Resolve-Path -LiteralPath $assetDir).Path)" >> $env:GITHUB_OUTPUT
      - name: Upload workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: Carbon-${{ github.ref_name }}-windows-x64
          path: ${{ steps.assets.outputs.asset_dir }}/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assetPaths = @(Get-ChildItem -LiteralPath $env:ASSET_DIR -File | Sort-Object Name | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assetPaths --clobber
          } else {
            & gh release create $tag @assetPaths --verify-tag --title "Carbon $tag" --notes "Windows x64 release: recommended NSIS installer, MSI, portable ZIP, CLI-only ZIP, and SHA-256 checksums."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed with exit code $LASTEXITCODE."
          }
